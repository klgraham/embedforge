[project]
name = "embedforge"
version = "0.1.0"
description = "Inspect, plan, embed, validate, and publish Hugging Face datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ken Graham" }]
keywords = ["embeddings", "huggingface", "openai", "openrouter", "datasets"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "openai>=1.40",
    "openrouter>=1.0",
]

[project.scripts]
embed = "embedforge.cli:main"

[project.urls]
Homepage = "https://github.com/klgraham/embedforge"
Repository = "https://github.com/klgraham/embedforge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embedforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["embedforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q"]

[tool.ty.environment]
python-version = "3.12"
python = "./.venv"
